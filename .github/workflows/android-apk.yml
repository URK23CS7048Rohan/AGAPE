# Builds an installable Android APK on every push (or on demand from the Actions tab).
# No Expo account needed. Every build on main is also published to the release "agape-android",
# so the website can link to a stable URL:
#   https://github.com/URK23CS7048Rohan/AGAPE/releases/download/agape-android/agape.apk
name: Android APK

on:
  push:
    branches: [main, master]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      # Supabase URL + publishable key come from app/.env (public values, committed).
      EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME is set),
      # so no separate SDK setup step is needed.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Check the JavaScript bundle (fails fast on code errors)
        run: npx expo export --platform android --output-dir /tmp/bundle-check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: agape-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish as the latest app release (website download link)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/*.apk agape.apk
          gh release delete agape-android --yes --cleanup-tag || true
          gh release create agape-android agape.apk \
            --title "Agape app (latest Android build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download agape.apk on an Android phone, open it and allow installing from this source." \
            --target "$GITHUB_SHA"
