# Publishes the app so people can download it from the church website:
#  • Android: builds the APK and puts it on a permanent link
#      https://github.com/<owner>/<repo>/releases/download/app-latest/agape.apk
#  • iPhone (and any browser): builds the installable web app and assembles the whole
#    website + /app into the "site-deploy" branch — connect that branch to Cloudflare Pages or Netlify.
# Optional repository secrets: EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SITE_URL
# (without them the app runs on demo data).
name: Publish app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, master, app-screenshots]
    paths: ["app/**", "website/**", ".github/workflows/publish-app.yml"]

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK for phones (arm64 + armv7)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/agape.apk"
          ls -la "$GITHUB_WORKSPACE/agape.apk"
      - name: Publish to the permanent download link
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest Agape app for Android, built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y'). Install: open this link on an Android phone, tap Download, then Install (allow installs from your browser the first time)."
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "Agape app · latest build" --notes "$NOTES" --latest=false
          gh release edit app-latest --notes "$NOTES" --latest=false
          gh release upload app-latest agape.apk --clobber
          echo "Download link: https://github.com/${{ github.repository }}/releases/download/app-latest/agape.apk"

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installable web app for /app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo install @expo/metro-runtime
          EXPO_BASE_URL=/app npx expo export --platform web --output-dir dist-app
          node tools/pwa.mjs dist-app /app
          grep -q 'rel="manifest"' dist-app/index.html && grep -q '/app/_expo' dist-app/index.html && echo "web app OK (installable, served from /app)"
      - name: Assemble website + web app → site-deploy branch
        run: |
          mkdir -p /tmp/site && cp -r website/. /tmp/site/
          rm -rf /tmp/site/tools /tmp/site/src
          cp -r app/dist-app /tmp/site/app
          # single-page app routing for /app/* (Cloudflare Pages & Netlify)
          printf '/app/*  /app/index.html  200\n' > /tmp/site/_redirects
          cd /tmp/site && git init -q -b site-deploy && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Website + web app (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site-deploy
